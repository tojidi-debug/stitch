name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '15 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Fetch ECOS data
        shell: pwsh
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ECOS_API_KEY)) {
            Write-Output "ECOS_API_KEY is not configured; using the committed data snapshot."
            exit 0
          }
          ./scripts/fetch-ecos-data.ps1
          ./scripts/fetch-ecos-data.ps1 -SeriesFile ./scripts/ecos2-series.json -OutputDir ./public/ecos-data
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
